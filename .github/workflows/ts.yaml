name: Typescript

on:
  pull_request:
    paths:
      - ts/**
      - .github/workflows/ts.yaml
  push:
    branches:
      - '**'
    paths:
      - ts/**
      - .github/workflows/ts.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          working_directory: ts

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: pnpm check

      - name: Run test
        run: pnpm test
